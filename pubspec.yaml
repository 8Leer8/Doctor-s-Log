name: arknight_reader
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_riverpod: ^2.6.1
  scrollable_positioned_list: ^0.3.8
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.3
  flutter_slidable: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    # Bundled covers (made by tools/bundle_covers.py)
    - assets/covers/main/
    - assets/covers/side/
    - assets/covers/vignette/
    - assets/covers/tilt.json
    # Old images: only act24side, act36side and act13mini are still used.
    - assets/images/side_stories/
    - assets/images/vignettes/
    - assets/data/chapter_descriptions.json
    - assets/data/character_sprites.json
    - assets/data/npc_sprites.json
